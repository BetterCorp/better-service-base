name: Build

on:
  pull_request:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  FORGEJO_REGISTRY: code.bettercorp.dev
  FORGEJO_SERVICE_BASE_IMAGE: code.bettercorp.dev/bettercorp/service-base
  FORGEJO_NODE_BASE_IMAGE: code.bettercorp.dev/bettercorp/docker-node:26
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PROGRESS: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  NPM_CONFIG_YES: "true"

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nodejs:
    name: Node.js workspaces
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check workspace lockfiles
        run: npm run ws:check-lockfiles

      - name: Build Node.js core
        run: npm run build --workspace docs --workspace nodejs --workspace tests/nodejs

      - name: Link workspace bins
        run: |
          chmod +x nodejs/lib/cli.js nodejs/lib/scripts/bsb-plugin-cli.js nodejs/lib/scripts/bsb-client-cli.js
          for bin in bsb:lib/cli.js bsb-plugin-cli:lib/scripts/bsb-plugin-cli.js bsb-client-cli:lib/scripts/bsb-client-cli.js; do
            name="${bin%%:*}"
            target="../../nodejs/${bin#*:}"
            ln -sf "$target" "node_modules/.bin/$name"
          done

      - name: Build plugin workspaces
        run: |
          for pkg in plugins/nodejs/*/package.json; do
            dir=$(dirname "$pkg")
            npm run build --workspace "$dir" --if-present
          done

      - name: Test Node.js core
        run: npm run test --workspace nodejs

  python:
    name: Python
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  go:
    name: Go
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
          cache-dependency-path: go/go.sum

      - name: Run tests
        run: go test ./...

      - name: Build CLI
        run: go build -o /tmp/bsb ./cmd/bsb

  dotnet:
    name: .NET
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: dotnet
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore BSB.sln

      - name: Build
        run: dotnet build BSB.sln --configuration Release --no-restore

  docker-nodejs:
    name: Node.js Docker image
    needs: [nodejs]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to Forgejo
        uses: docker/login-action@v3
        with:
          registry: ${{ env.FORGEJO_REGISTRY }}
          username: ${{ secrets.BC_CODE_USER }}
          password: ${{ secrets.BC_CODE_PACKAGE_TOKEN }}

      - name: Resolve BSB version
        id: bsb-version
        run: node -p '"version=" + require("./nodejs/package.json").version' >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./nodejs/Dockerfile
          build-args: |
            NODE_BASE_IMAGE=${{ env.FORGEJO_NODE_BASE_IMAGE }}
            BSB_VERSION=${{ steps.bsb-version.outputs.version }}
          load: true
          platforms: linux/amd64
          push: false
          tags: service-base:node-ci

      - name: Verify image supports additional npm packages
        run: |
          docker run --rm --entrypoint node service-base:node-ci --input-type=commonjs -e '
            const { existsSync, readFileSync } = require("node:fs");
            const manifest = JSON.parse(readFileSync("/home/bsb/package.json", "utf8"));
            if (manifest.dependencies?.["@bsb/base"] !== "${{ steps.bsb-version.outputs.version }}") {
              throw new Error("@bsb/base must reference the image build version");
            }
            if (existsSync("/home/bsb/package-lock.json")) {
              throw new Error("Runtime image must not contain the build-time lockfile");
            }
          '
          docker run --rm --entrypoint npm service-base:node-ci install --omit=dev --no-save @bsb/syslog@9.1.3

  docker-nodejs-vault:
    name: Node.js Vault Docker image
    needs: [nodejs]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to Forgejo
        uses: docker/login-action@v3
        with:
          registry: ${{ env.FORGEJO_REGISTRY }}
          username: ${{ secrets.BC_CODE_USER }}
          password: ${{ secrets.BC_CODE_PACKAGE_TOKEN }}

      - name: Build image
        uses: useblacksmith/build-push-action@v2
        with:
          build-args: |
            BSB_BASE_IMAGE=${{ env.FORGEJO_SERVICE_BASE_IMAGE }}:node-latest
            BSB_PLUGIN_VERSION=latest
          context: ./plugins/nodejs/config-vault
          file: ./plugins/nodejs/config-vault/Dockerfile
          load: true
          platforms: linux/amd64
          push: false
          tags: service-base:node-vault-ci

      - name: Verify bundled plugins
        run: |
          docker run --rm --entrypoint node service-base:node-vault-ci --input-type=commonjs -e '
            const required = [
              "@bsb/config-vault",
              "@bsb/observable-axiom",
              "@bsb/observable-graylog",
              "@bsb/observable-logging-file",
              "@bsb/observable-opentelemetry",
              "@bsb/observable-pino",
              "@bsb/observable-winston",
              "@bsb/observable-zipkin",
              "@bsb/syslog"
            ];
            required.forEach(packageName => require.resolve(packageName));
            try {
              require.resolve("@bsb/events-rabbitmq");
              throw new Error("@bsb/events-rabbitmq must not be bundled");
            } catch (error) {
              if (error.code !== "MODULE_NOT_FOUND") throw error;
            }
          '

  docker-go:
    name: Go Docker image
    needs: [go]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to DockerHub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Check Docker Hub quota
        continue-on-error: true
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: bash .github/scripts/check-dockerhub-rate-limit.sh golang:1.26-alpine alpine:3.24

      - name: Build image
        uses: useblacksmith/build-push-action@v2
        with:
          context: ./go
          file: ./go/Dockerfile
          platforms: linux/amd64
          push: false

  docker-python:
    name: Python Docker image
    needs: [python]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to DockerHub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Check Docker Hub quota
        continue-on-error: true
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: bash .github/scripts/check-dockerhub-rate-limit.sh python:3.14-slim

      - name: Build image
        uses: useblacksmith/build-push-action@v2
        with:
          context: ./python
          file: ./python/Dockerfile
          platforms: linux/amd64
          push: false

  docker-dotnet:
    name: .NET Docker image
    needs: [dotnet]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to DockerHub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build image
        uses: useblacksmith/build-push-action@v2
        with:
          context: ./dotnet
          file: ./dotnet/BetterServiceBase/Dockerfile
          platforms: linux/amd64
          push: false
