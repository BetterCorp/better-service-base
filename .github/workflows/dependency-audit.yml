name: Dependency audit
on:
  pull_request:
    paths: [package.json, package-lock.json, '**/package.json', go.mod, go.sum, scripts/security-regressions.test.mjs, .github/workflows/dependency-audit.yml]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm audit --package-lock-only --audit-level=high
      - run: npm ci --ignore-scripts
      - run: node --test scripts/security-regressions.test.mjs
