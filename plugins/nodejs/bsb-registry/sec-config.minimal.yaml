# BSB Registry - Minimal Configuration
# Quick start for local development with minimal setup

default:
  config:
    config-default:
      plugin: config-default
      enabled: true

  observable:
    observable-default:
      plugin: observable-default
      enabled: true
      config:
        level: debug                    # Verbose logging for development
        colors: true

  events:
    events-default:
      plugin: events-default
      enabled: true

  services:
    service-bsb-registry:
      plugin: service-bsb-registry
      enabled: true
      config:
        database:
          type: file
          path: ./.temp/registry-data
        auth:
          requireAuth: false            # Disable auth for local dev

    service-bsb-registry-ui:
      plugin: service-bsb-registry-ui
      enabled: true
      # No config required: all UI defaults and bundled assets are used.
