[package]
name = "bsb-rust-builtins"
version = "9.1.11"
edition = "2024"
rust-version = "1.95"
description = "Built-in Rust implementations for Better Service Base"
license = "MIT"
repository = "https://github.com/BetterCorp/better-service-base"

[lib]
name = "bsb_rust_builtins"

[dependencies]
bsb = { package = "better-service-base", path = "../../../rust" }
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "fs", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
lapin = "4.10"
futures-util = "0.3"
google-cloud-auth = { version = "1.16", features = ["idtoken"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
reqwest = { version = "0.13", features = ["json", "stream", "query"] }
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
rustls-native-certs = "0.8"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "rabbit-peer"
path = "examples/rabbit-peer.rs"
