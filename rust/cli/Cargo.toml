[package]
name = "better-service-base-cli"
version = "9.1.11"
edition = "2024"
rust-version = "1.95"
description = "BSB command-line host and client generator"
license = "MIT"
repository = "https://github.com/BetterCorp/better-service-base"

[lib]
name = "bsb_cli"

[[bin]]
name = "bsb"
path = "src/main.rs"

[dependencies]
bsb = { package = "better-service-base", path = ".." }
bsb-rust-builtins = { path = "../../plugins/rust/builtins" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "io-util", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "stream", "query"] }
toml = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
