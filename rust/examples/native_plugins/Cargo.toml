[package]
name = "bsb-native-examples"
version = "1.0.0"
edition = "2024"

[dependencies]
bsb = { package = "better-service-base", path = "../.." }
tokio = { version = "1", features = ["net", "time", "sync", "macros"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[dev-dependencies]
tempfile = "3"

[workspace]
