[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "service-base"
version = "9.1.11"
description = "Better Service Base native Python plugin host and typed client tooling"
requires-python = ">=3.11"
dependencies = [
  "anyvali>=1.1.5,<2",
  "packaging>=26.3,<27",
]

[project.scripts]
bsb = "bsb.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10", "mypy>=2.3.1,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bsb = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
